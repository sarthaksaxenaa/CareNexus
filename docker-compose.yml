# One-command stack: docker compose up --build
# Frontend http://localhost:3000, API http://localhost:8000/docs
# The API uses SQLite in a named volume; set DATABASE_URL for PostgreSQL.

services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - carenexus_data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Called from the browser, so it is the host-mapped port, not "backend".
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  carenexus_data:
