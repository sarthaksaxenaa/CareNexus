name: Deploy Pipeline

on:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  deploy-staging:
    name: "🚀 Deploy to Staging"
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Backend
        run: echo "Staging deployment configured — add deploy hooks when ready"
      - name: Deploy Frontend
        run: echo "Staging deployment configured — add Vercel token when ready"

  deploy-production:
    name: "🚀 Deploy to Production"
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy Backend
        run: echo "Production deployment configured — add deploy hooks when ready"
      - name: Deploy Frontend
        run: echo "Production deployment configured — add Vercel token when ready"
