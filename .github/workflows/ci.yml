name: CI Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege: the pipeline only needs to read the code.
permissions:
  contents: read

# Runner image pinned so an OS migration cannot change results underneath us.
env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ─── Backend ─────────────────────────────────────────────────────────────
  backend-lint:
    name: "🐍 Backend Lint & Format"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      # Install the ruff version pinned in requirements-dev.txt so CI and local agree.
      - run: pip install "$(grep -E '^ruff==' requirements-dev.txt)"
      - run: ruff check .
      - run: ruff format --check .

  backend-test:
    name: "🧪 Backend Tests & Coverage"
    runs-on: ubuntu-24.04
    needs: backend-lint
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: "pip install -r requirements.txt -r requirements-dev.txt --only-binary :all:"
      # Deprecations fail the build so library upgrades never break silently.
      - run: pytest -W error::DeprecationWarning --cov --cov-report=xml --cov-report=term --cov-fail-under=90
        env:
          TESTING: "true"
      - name: Retrieval accuracy
        run: python -m scripts.eval_retrieval
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 14

  backend-audit:
    name: "🛡️ Backend Dependency Audit"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt -r requirements-dev.txt

  # ─── Frontend ────────────────────────────────────────────────────────────
  frontend-lint:
    name: "⚛️ Frontend Lint, Types & Unit Tests"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test

  frontend-audit:
    name: "🛡️ Frontend Dependency Audit"
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      # Reads the lockfile only; no install needed.
      - run: npm audit --audit-level=moderate

  # ─── Whole system ────────────────────────────────────────────────────────
  e2e:
    name: "🌐 End-to-End (Browser + API + DB)"
    runs-on: ubuntu-24.04
    needs: [backend-test, frontend-lint]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        run: "pip install -r backend/requirements.txt --only-binary :all:"
      - name: Install frontend
        working-directory: ./frontend
        run: npm ci
      - name: Production build
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Install Chromium
        working-directory: ./frontend
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        working-directory: ./frontend
        run: npm run e2e
        env:
          E2E_PYTHON: python
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 14
